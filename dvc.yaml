stages:

  preprocess:
    cmd: python src/data/preprocess.py
    deps:
      - src/data/preprocess.py
      - data/raw
    outs:
      - data/processed/train.parquet

  features:
    cmd: python src/features/build_features.py
    deps:
      - src/features/build_features.py
      - data/processed/train.parquet
    outs:
      - data/processed/features.parquet

  baseline:
    cmd: python src/training/train_baseline.py
    deps:
      - src/training/train_baseline.py
      - data/processed/features.parquet
    outs:
      - reports/baseline_metrics.json

  xgboost:
    cmd: python src/training/train_xgboost.py
    deps:
      - src/training/train_xgboost.py
      - data/processed/features.parquet
    outs:
      - models/xgboost_demand_model.json
    metrics:
      - reports/xgboost_metrics.json

  model_comparison:
    cmd: python src/training/compare_models.py
    deps:
      - src/training/compare_models.py
      - reports/baseline_metrics.json
      - reports/xgboost_metrics.json
    outs:
      - reports/model_comparison.csv
      - reports/model_selection.json

  diagnostics:
    cmd: python src/training/model_diagnostics.py
    deps:
      - src/training/model_diagnostics.py
      - reports/xgboost_metrics.json
    outs:
      - reports/model_diagnostics.json

  error_analysis:
    cmd: python src/training/error_analysis.py
    deps:
      - src/training/error_analysis.py
      - data/processed/features.parquet
      - models/xgboost_demand_model.json
    outs:
      - reports/error_analysis.csv

  mlflow_tracking:
    cmd: python src/training/mlflow_tracking.py
    deps:
      - src/training/mlflow_tracking.py
      - reports/xgboost_metrics.json
      - reports/model_selection.json
      - reports/model_diagnostics.json
      - models/xgboost_demand_model.json

  monitoring:
    cmd: python src/monitoring/monitor.py
    deps:
      - src/monitoring/monitor.py
      - data/processed/features.parquet
      - models/xgboost_demand_model.json
    outs:
      - reports/monitoring_predictions.csv
    metrics:
      - reports/monitoring_metrics.csv

  drift_detection:
    cmd: python src/monitoring/drift_report.py
    deps:
      - src/monitoring/drift_report.py
      - data/processed/features.parquet
    outs:
      - reports/data_drift_report.html

  monitoring_alerts:
    cmd: python src/monitoring/monitoring_alerts.py
    deps:
      - src/monitoring/monitoring_alerts.py
      - reports/monitoring_metrics.csv
    metrics:
      - reports/monitoring_alerts.csv

  explainability:
    cmd: python src/training/explain_model.py
    deps:
      - src/training/explain_model.py
      - data/processed/features.parquet
      - models/xgboost_demand_model.json
    outs:
      - reports/shap_feature_importance.csv
      - reports/shap_values.csv